<app-page-header title="Оцінки" subtitle="Перегляд і виставлення оцінок вашим студентам"></app-page-header>

<form [formGroup]="form" class="grade-form">
  <mat-form-field appearance="outline">
    <mat-label>Предмет</mat-label>
    <mat-select formControlName="subjectId">
      <mat-option *ngFor="let s of subjects" [value]="s.id">{{ s.name }}</mat-option>
    </mat-select>
  </mat-form-field>

  <mat-form-field appearance="outline">
    <mat-label>Студент</mat-label>
    <mat-select formControlName="studentId">
      <mat-option *ngFor="let st of filteredStudents" [value]="st.id">{{ st.lastName }} {{ st.firstName }}</mat-option>
    </mat-select>
  </mat-form-field>

  <table
    mat-table
    [dataSource]="grades"
    class="mat-elevation-z1 full-width"
    *ngIf="form.get('studentId')?.value"
  >
    <ng-container matColumnDef="date">
      <th mat-header-cell *matHeaderCellDef>Дата</th>
      <td mat-cell *matCellDef="let g">{{ g.date | date: 'dd.MM.yyyy' }}</td>
    </ng-container>
    <ng-container matColumnDef="value">
      <th mat-header-cell *matHeaderCellDef>Оцінка</th>
      <td mat-cell *matCellDef="let g">{{ g.value }}</td>
    </ng-container>
    <ng-container matColumnDef="comment">
      <th mat-header-cell *matHeaderCellDef>Коментар</th>
      <td mat-cell *matCellDef="let g">{{ g.comment }}</td>
    </ng-container>
    <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
    <tr mat-row *matRowDef="let row; columns: displayedColumns"></tr>
  </table>

  <p *ngIf="form.get('studentId')?.value && !grades.length">Оцінок ще немає.</p>

  <mat-divider *ngIf="form.get('studentId')?.value"></mat-divider>

  <ng-container *ngIf="form.get('studentId')?.value">
    <h3>Додати оцінку</h3>
    <div class="grade-form__row">
      <mat-form-field appearance="outline">
        <mat-label>Дата</mat-label>
        <input matInput [matDatepicker]="picker" formControlName="date" />
        <mat-datepicker-toggle matIconSuffix [for]="picker"></mat-datepicker-toggle>
        <mat-datepicker #picker></mat-datepicker>
      </mat-form-field>
      <mat-form-field appearance="outline">
        <mat-label>Оцінка (0-100)</mat-label>
        <input matInput type="number" formControlName="value" min="0" max="100" />
      </mat-form-field>
      <mat-form-field appearance="outline" class="comment-field">
        <mat-label>Коментар</mat-label>
        <input matInput formControlName="comment" />
      </mat-form-field>
      <button mat-raised-button color="primary" type="button" (click)="addGrade()">Додати</button>
    </div>
  </ng-container>
</form>

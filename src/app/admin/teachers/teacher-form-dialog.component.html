<h2 mat-dialog-title>{{ data.teacher ? 'Редагувати викладача' : 'Новий викладач' }}</h2>
<mat-dialog-content>
  <form [formGroup]="form" class="form-grid">
    <mat-form-field appearance="outline">
      <mat-label>Прізвище</mat-label>
      <input matInput formControlName="lastName" />
    </mat-form-field>
    <mat-form-field appearance="outline">
      <mat-label>Ім'я</mat-label>
      <input matInput formControlName="firstName" />
    </mat-form-field>
    <mat-form-field appearance="outline">
      <mat-label>Email</mat-label>
      <input matInput formControlName="email" type="email" />
    </mat-form-field>
    <mat-form-field appearance="outline">
      <mat-label>Телефон</mat-label>
      <input matInput formControlName="phone" />
    </mat-form-field>
    <mat-form-field appearance="outline">
      <mat-label>Кафедра</mat-label>
      <mat-select formControlName="departmentId">
        @for (dept of data.departments; track dept) {
          <mat-option [value]="dept.id">{{ dept.name }}</mat-option>
        }
      </mat-select>
    </mat-form-field>
  </form>
</mat-dialog-content>
<mat-dialog-actions align="end">
  <button mat-button (click)="cancel()">Скасувати</button>
  <button mat-raised-button color="primary" (click)="save()">Зберегти</button>
</mat-dialog-actions>

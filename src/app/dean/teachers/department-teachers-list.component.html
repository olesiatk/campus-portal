<app-page-header title="Викладачі кафедри"></app-page-header>

<mat-form-field appearance="outline" class="filter-field">
  <mat-label>Пошук</mat-label>
  <input matInput (input)="applyFilter($any($event.target).value)" placeholder="ПІБ, email..." />
</mat-form-field>

<table mat-table [dataSource]="dataSource" class="mat-elevation-z1 full-width">
  <ng-container matColumnDef="lastName">
    <th mat-header-cell *matHeaderCellDef>ПІБ</th>
    <td mat-cell *matCellDef="let t">{{ t.lastName }} {{ t.firstName }}</td>
  </ng-container>
  <ng-container matColumnDef="email">
    <th mat-header-cell *matHeaderCellDef>Email</th>
    <td mat-cell *matCellDef="let t">{{ t.email }}</td>
  </ng-container>
  <ng-container matColumnDef="phone">
    <th mat-header-cell *matHeaderCellDef>Телефон</th>
    <td mat-cell *matCellDef="let t">{{ t.phone }}</td>
  </ng-container>
  <ng-container matColumnDef="subjectCount">
    <th mat-header-cell *matHeaderCellDef>Предметів</th>
    <td mat-cell *matCellDef="let t">{{ t.subjectCount }}</td>
  </ng-container>
  <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
  <tr mat-row *matRowDef="let row; columns: displayedColumns"></tr>
</table>

<mat-paginator [pageSizeOptions]="[10, 25]" [pageSize]="10"></mat-paginator>

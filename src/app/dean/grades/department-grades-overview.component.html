<app-page-header title="Оцінки кафедри" subtitle="Перегляд без можливості редагування"></app-page-header>

<mat-form-field appearance="outline" class="filter-field">
  <mat-label>Пошук</mat-label>
  <input matInput (input)="applyFilter($any($event.target).value)" placeholder="Студент, предмет, викладач..." />
</mat-form-field>

<table mat-table [dataSource]="dataSource" class="mat-elevation-z1 full-width">
  <ng-container matColumnDef="date">
    <th mat-header-cell *matHeaderCellDef>Дата</th>
    <td mat-cell *matCellDef="let g">{{ g.date | date: 'dd.MM.yyyy' }}</td>
  </ng-container>
  <ng-container matColumnDef="student">
    <th mat-header-cell *matHeaderCellDef>Студент</th>
    <td mat-cell *matCellDef="let g">{{ g.studentName }}</td>
  </ng-container>
  <ng-container matColumnDef="subject">
    <th mat-header-cell *matHeaderCellDef>Предмет</th>
    <td mat-cell *matCellDef="let g">{{ g.subjectName }}</td>
  </ng-container>
  <ng-container matColumnDef="teacher">
    <th mat-header-cell *matHeaderCellDef>Викладач</th>
    <td mat-cell *matCellDef="let g">{{ g.teacherName }}</td>
  </ng-container>
  <ng-container matColumnDef="value">
    <th mat-header-cell *matHeaderCellDef>Оцінка</th>
    <td mat-cell *matCellDef="let g">{{ g.value }}</td>
  </ng-container>
  <ng-container matColumnDef="comment">
    <th mat-header-cell *matHeaderCellDef>Коментар</th>
    <td mat-cell *matCellDef="let g">{{ g.comment }}</td>
  </ng-container>
  <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
  <tr mat-row *matRowDef="let row; columns: displayedColumns"></tr>
</table>

<mat-paginator [pageSizeOptions]="[10, 25, 50, 100]" [pageSize]="25"></mat-paginator>

<app-page-header title="Студенти кафедри"></app-page-header>

<mat-form-field appearance="outline" class="filter-field">
  <mat-label>Пошук</mat-label>
  <input matInput (input)="applyFilter($any($event.target).value)" placeholder="ПІБ, група..." />
</mat-form-field>

<table mat-table [dataSource]="dataSource" class="mat-elevation-z1 full-width">
  <ng-container matColumnDef="lastName">
    <th mat-header-cell *matHeaderCellDef>ПІБ</th>
    <td mat-cell *matCellDef="let s">{{ s.lastName }} {{ s.firstName }}</td>
  </ng-container>
  <ng-container matColumnDef="email">
    <th mat-header-cell *matHeaderCellDef>Email</th>
    <td mat-cell *matCellDef="let s">{{ s.email }}</td>
  </ng-container>
  <ng-container matColumnDef="group">
    <th mat-header-cell *matHeaderCellDef>Група</th>
    <td mat-cell *matCellDef="let s">{{ s.groupName }} <span *ngIf="s.subgroup">(підгр. {{ s.subgroup }})</span></td>
  </ng-container>
  <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
  <tr mat-row *matRowDef="let row; columns: displayedColumns"></tr>
</table>

<mat-paginator [pageSizeOptions]="[10, 25, 50]" [pageSize]="25"></mat-paginator>

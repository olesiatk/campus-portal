<app-page-header title="Огляд кафедри" [subtitle]="department?.name || ''"></app-page-header>

@if (stats) {
  <div class="stats-grid">
    <mat-card class="stat-card stat-card--highlight" routerLink="/dean/teachers">
      <mat-icon>school</mat-icon>
      <div class="stat-card__value">{{ stats.teachers }}</div>
      <div class="stat-card__label">Викладачі</div>
    </mat-card>
    <mat-card class="stat-card stat-card--highlight" routerLink="/dean/students">
      <mat-icon>groups</mat-icon>
      <div class="stat-card__value">{{ stats.students }}</div>
      <div class="stat-card__label">Студенти</div>
    </mat-card>
    <mat-card class="stat-card stat-card--highlight" routerLink="/dean/subjects">
      <mat-icon>menu_book</mat-icon>
      <div class="stat-card__value">{{ stats.subjects }}</div>
      <div class="stat-card__label">Предмети</div>
    </mat-card>
  </div>
}

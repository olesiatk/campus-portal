<app-page-header title="Предмети кафедри"></app-page-header>

<mat-form-field appearance="outline" class="filter-field">
  <mat-label>Пошук</mat-label>
  <input matInput (input)="applyFilter($any($event.target).value)" placeholder="Назва, викладач..." />
</mat-form-field>

<table mat-table [dataSource]="dataSource" class="mat-elevation-z1 full-width">
  <ng-container matColumnDef="name">
    <th mat-header-cell *matHeaderCellDef>Назва</th>
    <td mat-cell *matCellDef="let s">{{ s.name }}</td>
  </ng-container>
  <ng-container matColumnDef="stream">
    <th mat-header-cell *matHeaderCellDef>Потік</th>
    <td mat-cell *matCellDef="let s">{{ s.streamLabel }}</td>
  </ng-container>
  <ng-container matColumnDef="teacher">
    <th mat-header-cell *matHeaderCellDef>Викладач</th>
    <td mat-cell *matCellDef="let s">{{ s.teacherName }}</td>
  </ng-container>
  <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
  <tr mat-row *matRowDef="let row; columns: displayedColumns"></tr>
</table>

<mat-paginator [pageSizeOptions]="[10, 25, 50]" [pageSize]="25"></mat-paginator>

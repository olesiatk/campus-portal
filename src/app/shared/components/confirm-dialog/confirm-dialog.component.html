<h2 mat-dialog-title>{{ data.title }}</h2>
<mat-dialog-content>{{ data.message }}</mat-dialog-content>
<mat-dialog-actions align="end">
  <button mat-button (click)="cancel()">{{ data.cancelLabel || 'Скасувати' }}</button>
  <button mat-raised-button color="warn" (click)="confirm()">{{ data.confirmLabel || 'Підтвердити' }}</button>
</mat-dialog-actions>

<app-page-header title="Одногрупники"></app-page-header>

<table mat-table [dataSource]="classmates" class="mat-elevation-z1 full-width">
  <ng-container matColumnDef="lastName">
    <th mat-header-cell *matHeaderCellDef>ПІБ</th>
    <td mat-cell *matCellDef="let s">
      {{ s.lastName }} {{ s.firstName }}
      @if (s.id === currentUserId) {
        <mat-chip class="you-chip">Ви</mat-chip>
      }
    </td>
  </ng-container>
  <ng-container matColumnDef="email">
    <th mat-header-cell *matHeaderCellDef>Email</th>
    <td mat-cell *matCellDef="let s">{{ s.email }}</td>
  </ng-container>
  <ng-container matColumnDef="phone">
    <th mat-header-cell *matHeaderCellDef>Телефон</th>
    <td mat-cell *matCellDef="let s">{{ s.phone }}</td>
  </ng-container>
  <ng-container matColumnDef="subgroup">
    <th mat-header-cell *matHeaderCellDef>Підгрупа</th>
    <td mat-cell *matCellDef="let s">{{ s.subgroup || '—' }}</td>
  </ng-container>
  <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
  <tr mat-row *matRowDef="let row; columns: displayedColumns"></tr>
</table>

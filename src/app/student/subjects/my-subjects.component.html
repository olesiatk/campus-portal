<app-page-header title="Мої предмети"></app-page-header>

<table mat-table [dataSource]="subjects" class="mat-elevation-z1 full-width">
  <ng-container matColumnDef="name">
    <th mat-header-cell *matHeaderCellDef>Назва</th>
    <td mat-cell *matCellDef="let s">{{ s.name }}</td>
  </ng-container>
  <ng-container matColumnDef="teacher">
    <th mat-header-cell *matHeaderCellDef>Викладач</th>
    <td mat-cell *matCellDef="let s">{{ s.teacherName }}</td>
  </ng-container>
  <ng-container matColumnDef="type">
    <th mat-header-cell *matHeaderCellDef>Тип</th>
    <td mat-cell *matCellDef="let s">{{ s.isElective ? 'З іншої кафедри' : 'Основний' }}</td>
  </ng-container>
  <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
  <tr mat-row *matRowDef="let row; columns: displayedColumns"></tr>
</table>

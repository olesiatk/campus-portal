<app-page-header title="Мої оцінки"></app-page-header>

@for (sg of bySubject; track sg) {
  <mat-card class="subject-card">
    <div class="subject-card__header">
      <h3>{{ sg.subject.name }}</h3>
      <span class="subject-card__average">Середній бал: {{ sg.average }}</span>
    </div>
    <table mat-table [dataSource]="sg.grades" class="full-width">
      <ng-container matColumnDef="date">
        <th mat-header-cell *matHeaderCellDef>Дата</th>
        <td mat-cell *matCellDef="let g">{{ g.date | date: 'dd.MM.yyyy' }}</td>
      </ng-container>
      <ng-container matColumnDef="value">
        <th mat-header-cell *matHeaderCellDef>Оцінка</th>
        <td mat-cell *matCellDef="let g">{{ g.value }}</td>
      </ng-container>
      <ng-container matColumnDef="comment">
        <th mat-header-cell *matHeaderCellDef>Коментар</th>
        <td mat-cell *matCellDef="let g">{{ g.comment }}</td>
      </ng-container>
      <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
      <tr mat-row *matRowDef="let row; columns: displayedColumns"></tr>
    </table>
  </mat-card>
}
